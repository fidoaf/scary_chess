<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.65" fx="0.32" fy="0.25">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0ece0"/>
      <stop offset="60%" stop-color="#d8d0c0"/>
      <stop offset="100%" stop-color="#a8a090"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="75%" stop-color="#787068" stop-opacity="0"/>
      <stop offset="100%" stop-color="#787068" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4d8"/>
      <stop offset="40%" stop-color="#c8c0b0"/>
      <stop offset="100%" stop-color="#989088"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.4" cy="0.18" r="0.3">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#1b1b2f"/>

  <!-- Board hint: two squares -->
  <rect x="4" y="22" width="12" height="8" fill="#7a6840" rx="1"/>
  <rect x="16" y="22" width="12" height="8" fill="#c8b88a" rx="1"/>

  <!-- Ground shadow -->
  <ellipse cx="16" cy="26" rx="8" ry="1.5" fill="rgba(0,0,0,0.3)"/>

  <!-- King piece body -->
  <path d="M10,25 C10,21 11,19 12,17.5 C10.5,16 10,14 10.5,11.5 C11,9 13,7 16,6 C19,7 21,9 21.5,11.5 C22,14 21.5,16 20,17.5 C21,19 22,21 22,25 Z"
        fill="url(#body)" stroke="#908878" stroke-width="0.8" stroke-linejoin="round" filter="url(#sh)"/>
  <path d="M10,25 C10,21 11,19 12,17.5 C10.5,16 10,14 10.5,11.5 C11,9 13,7 16,6 C19,7 21,9 21.5,11.5 C22,14 21.5,16 20,17.5 C21,19 22,21 22,25 Z"
        fill="url(#side)"/>
  <path d="M10,25 C10,21 11,19 12,17.5 C10.5,16 10,14 10.5,11.5 C11,9 13,7 16,6 C19,7 21,9 21.5,11.5 C22,14 21.5,16 20,17.5 C21,19 22,21 22,25 Z"
        fill="url(#spec)"/>

  <!-- Pedestal -->
  <path d="M7,27 Q7,25.5 9,25 L23,25 Q25,25.5 25,27 Z" fill="url(#base)" stroke="#908878" stroke-width="0.7"/>

  <!-- Cross - vertical -->
  <rect x="14.8" y="2" width="2.4" height="5.5" rx="0.5" fill="url(#body)" stroke="#908878" stroke-width="0.6"/>
  <rect x="15.1" y="2.3" width="0.9" height="4.8" rx="0.3" fill="#ffffff" opacity="0.3"/>

  <!-- Cross - horizontal -->
  <rect x="13" y="3.5" width="6" height="2" rx="0.5" fill="url(#body)" stroke="#908878" stroke-width="0.6"/>
  <rect x="13.3" y="3.7" width="5.4" height="0.7" rx="0.3" fill="#ffffff" opacity="0.3"/>

  <!-- Collar ring -->
  <ellipse cx="16" cy="17.5" rx="4" ry="0.8" fill="none" stroke="#b8b0a0" stroke-width="0.7" opacity="0.6"/>
</svg>
